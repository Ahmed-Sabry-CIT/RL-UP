[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-baselines"
version = "1.0.0"
description = "Dataset curation and static LightGBM/XGBoost baselines for the explainability-guided MARL project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "xgboost>=2.0,<3",
  "imbalanced-learn>=0.12,<1",
  "pyarrow>=15",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "tabulate>=0.9"]

[project.scripts]
baselines = "baselines.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
