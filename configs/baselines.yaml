# Static baseline pipeline configuration (component: feature/baselines)

seed: 42

paths:
  raw: data/raw
  processed: data/processed
  results: results
  logs: logs

# Stratified split of the curated pool (train / val / test sum to 1.0).
splits:
  train: 0.60
  val: 0.20
  test: 0.20

# Traditional, *uncoupled* preprocessing fitted on the training split only.
preprocessing:
  max_missing_fraction: 0.45   # drop columns with more missings than this
  max_cardinality: 100         # drop object columns with more distinct values
  min_frequency: 0.01          # group rare levels before one-hot encoding
  scale: true                  # standardise numeric features
  add_missing_indicators: true

# Traditional imbalance handling for the static baselines: balanced class
# weights.  `smote` (train split only) is available via --imbalance smote.
imbalance: class_weight

# Percentile bootstrap resamples for the reported confidence intervals (0 = off)
bootstrap_samples: 200

# Static model hyper-parameters (early stopping runs on the validation split).
models:
  lightgbm:
    n_estimators: 1000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    reg_lambda: 1.0
  xgboost:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
